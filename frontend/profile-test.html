<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Generation Test</title>
    <link rel="stylesheet" href="static/css/main.css">
    <link rel="stylesheet" href="static/css/cards.css">
</head>
<body>
    <div style="padding: 20px;">
        <h1>Profile Generation Test</h1>
        
        <div class="card">
            <h2>YData Profile Generation</h2>
            <p>Testing the profile generation functionality</p>
            
            <button id="load-data-btn" class="btn btn-primary">Load Test Data</button>
            <button id="generate-profile-btn" class="btn btn-secondary" disabled>Generate Profile Report</button>
            
            <div id="status" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
                Status: Ready
            </div>
        </div>
    </div>

    <script type="module">
        import { uploadDataset, PROFILE_REPORT_URL } from './static/js/api.js';
        
        const statusDiv = document.getElementById('status');
        const loadBtn = document.getElementById('load-data-btn');
        const profileBtn = document.getElementById('generate-profile-btn');
        
        function updateStatus(message) {
            statusDiv.textContent = `Status: ${message}`;
            console.log(`📈 ${message}`);
        }
        
        // Test data
        const testCsvData = `name,age,salary,department,is_manager,join_date
Alice,25,50000,Engineering,true,2023-01-15
Bob,30,60000,Marketing,false,2022-06-20
Charlie,35,70000,Engineering,true,2021-03-10
Diana,28,55000,Sales,false,2023-08-05
Eve,32,65000,Marketing,false,2022-11-12
Frank,29,58000,Engineering,false,2023-02-28
Grace,31,62000,Sales,true,2022-09-15
Henry,27,52000,Marketing,false,2023-05-10
Ivy,33,68000,Engineering,true,2021-12-01
Jack,26,51000,Sales,false,2023-07-20`;
        
        loadBtn.addEventListener('click', async () => {
            try {
                updateStatus('Uploading test data...');
                
                // Create a blob from the CSV data
                const blob = new Blob([testCsvData], { type: 'text/csv' });
                const file = new File([blob], 'test.csv', { type: 'text/csv' });
                
                // Upload the data
                const result = await uploadDataset(file);
                updateStatus(`Data uploaded: ${result.rows} rows, ${result.columns} columns`);
                
                profileBtn.disabled = false;
                
            } catch (error) {
                updateStatus(`Upload error: ${error.message}`);
                console.error('❌ Upload error:', error);
            }
        });
        
        profileBtn.addEventListener('click', () => {
            try {
                updateStatus('Opening profile report in new tab...');
                console.log('🔗 Profile URL:', PROFILE_REPORT_URL);
                
                // Open the profile report in a new tab
                const newWindow = window.open(PROFILE_REPORT_URL, '_blank');
                
                if (newWindow) {
                    updateStatus('Profile report opened in new tab');
                } else {
                    updateStatus('Failed to open new tab - popup blocked?');
                }
                
            } catch (error) {
                updateStatus(`Profile error: ${error.message}`);
                console.error('❌ Profile error:', error);
            }
        });
        
        updateStatus('Ready - Click "Load Test Data" to begin');
        console.log('🚀 Profile test page loaded');
        console.log('📡 API Base URL:', PROFILE_REPORT_URL);
    </script>
</body>
</html>
